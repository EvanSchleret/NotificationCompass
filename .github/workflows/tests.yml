name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: 11
            php: '8.2'
            testbench: '^9.0'
          - laravel: 12
            php: '8.3'
            testbench: '^10.0'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite3
          coverage: none

      - run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update
      - run: composer update --prefer-dist --no-interaction --with-all-dependencies
      - run: composer test
      - run: composer validate --no-check-publish --no-interaction
      - run: composer lint
